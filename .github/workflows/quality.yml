name: Quality

# OKQ quality gate: one report comment per pull request, and the changeset check.
# See https://github.com/maximeshr/quality-gate
on:
  pull_request:
    branches: [canary]
  push:
    branches: [canary, main]

permissions:
  contents: read

jobs:
  report:
    uses: maximeshr/quality-gate/.github/workflows/reusable-report.yml@v0.5.0
    permissions:
      contents: read
      pull-requests: write
  changesets:
    uses: maximeshr/quality-gate/.github/workflows/reusable-changesets.yml@v0.5.0
    permissions:
      contents: read
    secrets:
      RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
