name: Release

# Shared OKQ release flow (https://github.com/maximeshr/quality-gate):
# - push to canary: open or update the canary -> main release pull request;
# - push to main: version, CHANGELOG, npm publish (`vp run release`), tag, GitHub release.
# Keep this file name: it is the npm trusted publisher.
on:
  push:
    branches: [canary, main]

concurrency: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  release-pr:
    if: github.ref_name == 'canary'
    uses: maximeshr/quality-gate/.github/workflows/reusable-release-pr.yml@v0.4.0
    permissions:
      contents: read
      pull-requests: write
  release:
    if: github.ref_name == 'main'
    uses: maximeshr/quality-gate/.github/workflows/reusable-release.yml@v0.4.0
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    with:
      publish: true
    secrets:
      RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
