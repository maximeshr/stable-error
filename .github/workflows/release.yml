name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm provenance / trusted publishing.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26" # current LTS
          cache: true
      - run: vp install
      - run: vp check
      - run: vp run check:version
      - run: vp test
      - uses: changesets/action@v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: vp run version-packages
          publish-script: vp run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
