name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # The Windows image checks out CRLF, and the formatter requires LF.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true
      - run: vp install
      - run: vp check
      - run: vp run check:version
      - run: vp test
      - run: vp pack
      - name: Import the packed library
        run: node --input-type=module -e "import { createStableError } from './dist/index.mjs'; if (typeof createStableError !== 'function') process.exit(1)"
      # Ubuntu only: the Windows job is continue-on-error, so a failure
      # there would not block the pull request. pnpm comes from setup-vp.
      - name: Audit high and critical vulnerabilities
        if: runner.os == 'Linux'
        run: pnpm audit --audit-level=high
