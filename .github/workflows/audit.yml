name: Audit

# Dependabot does not raise security alerts for a pnpm 12 lockfile
# (two YAML documents). This weekly run is the safety net between pull requests.
on:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26" # current LTS
          cache: true
      - run: vp install
      - run: pnpm audit --audit-level=high
