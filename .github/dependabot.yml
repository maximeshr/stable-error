version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Let fresh releases settle for 14 days before proposing them. Several
    # tools here are young (vite-plus 1.x, oxfmt and tsdown 0.x). Security
    # updates are not delayed.
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The @types/node major follows the engines.node minimum (22), not the
      # dev runtime. Raise both together, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # vite-plus pins its vite core and vitest: bump them together.
      vite-plus:
        patterns: ["vite-plus", "vite", "vitest"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
