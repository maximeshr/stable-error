version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Runtime is Node 26 LTS. @types/node majors stay out of this
      # change; bump them in a dedicated dependency pull request.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # vite-plus pins its vite core and vitest: bump them together.
      vite-plus:
        patterns: ["vite-plus", "vite", "vitest"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
