catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
overrides:
  vite@*: "catalog:"
  # Same Vitest copy as `vp test` (vite-plus 1.7.0 bundles 5.1.0).
  # 5.0.4 is GHSA-p458-7748-mcp3; do not float above the bundled runner.
  vitest@*: "5.1.0"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  # quality-gate's `prepare` only installs its own git hooks: never run it here.
  quality-gate: false

# Let fresh releases settle for 5 days (in minutes).
minimumReleaseAge: 7200
